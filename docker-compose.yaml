x-mongo-env: &mongo-auth "mongodb://admin:qwerty@mongo:27017"

services:
  mongo:
    image: mongo
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwerty

  mongo-express:
    image: mongo-express
    ports:
      - 8090:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwerty
      ME_CONFIG_MONGODB_URL: *mongo-auth
    depends_on:
      - mongo

  product-service:
    build: { context: ., args: { SERVICE: product-service } }
    ports:
      - 8081:8081
    environment:
      SPRING_MONGODB_URI: mongodb://admin:qwerty@mongo:27017/products?authSource=admin
    depends_on:
      - mongo

  cart-service:
    build: { context: ., args: { SERVICE: cart-service } }
    ports:
      - 8082:8082
    environment:
      SPRING_MONGODB_URI: mongodb://admin:qwerty@mongo:27017/carts?authSource=admin
      PRODUCT_SERVICE_URL: http://product-service:8081
    depends_on:
      - mongo
      - product-service

  order-service:
    build: { context: ., args: { SERVICE: order-service } }
    ports:
      - 8083:8083
    environment:
      SPRING_MONGODB_URI: mongodb://admin:qwerty@mongo:27017/orders?authSource=admin
      PRODUCT_SERVICE_URL: http://product-service:8081
      CART_SERVICE_URL: http://cart-service:8082
    depends_on:
      - mongo
      - product-service
      - cart-service

  gateway:
    build: { context: ., args: { SERVICE: gateway } }
    ports:
      - 8080:8080
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8081
      CART_SERVICE_URL: http://cart-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
    depends_on:
      - product-service
      - cart-service
      - order-service
